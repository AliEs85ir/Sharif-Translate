name: Windows package and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  package:
    name: Test and build Windows ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Check version and tag
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content gradle.properties -Raw), '(?m)^appVersion=([0-9]+\.[0-9]+\.[0-9]+)\r?$')
          if (-not $match.Success) { throw 'appVersion must be a semantic version in gradle.properties' }
          $version = $match.Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag must be v$version"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build and test
        shell: pwsh
        run: .\gradlew.bat test :app:windowsZip --no-daemon --no-configuration-cache

      - name: Audit clean package
        shell: pwsh
        run: |
          $package = "app/build/distributions/SharifTranslate-$env:APP_VERSION-windows-x64.zip"
          if (-not (Test-Path $package)) { throw "Package missing: $package" }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $package))
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            if (-not ($names | Where-Object { $_ -like '*/Sharif Translate.exe' })) { throw 'EXE missing from package' }
            if (-not ($names | Where-Object { $_ -like '*/app/SharifTranslate.jar' })) { throw 'Application JAR missing' }
            if (@($names | Where-Object { $_ -match '(?i)(^|/)(app_settings|plugin_registry|history|collections)\.json$|(^|/)\.env($|/)|(^|/)logs/|(^|/)id_(rsa|ed25519)($|/)' }).Count -gt 0) {
              throw 'Personal data or secrets found in package'
            }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $package -Leaf)" | Set-Content SHA256SUMS.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      - name: Upload package for review
        uses: actions/upload-artifact@v6
        with:
          name: windows-package
          path: |
            app/build/distributions/SharifTranslate-*-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-package
          path: dist
      - name: Publish tested package
        uses: softprops/action-gh-release@v3
        with:
          name: Sharif Translate ${{ github.ref_name }}
          prerelease: ${{ github.ref_name == 'v0.1.0' }}
          body: |
            Initial public preview of Sharif Translate by Ali Esmaeili (AliEs85ir).

            - Portable Windows x64 ZIP with the Sharif Translate EXE, Java runtime, and official Google, Bing, and configurable AI plugins.
            - Translation, speech, dictionary, OCR, history, collections, and multilingual desktop UI.
            - AI features use each user's own provider key and model; no developer key is bundled.

            Extract the ZIP and run `Sharif Translate.exe`. See README.md for setup and SHA256SUMS.txt to verify the download.

            The project builds on the original QTranslate codebase by Ahmed Hatem. The original MIT notice and third-party licenses remain in LICENSE and bundled resources.
          files: |
            dist/app/build/distributions/SharifTranslate-*-windows-x64.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
